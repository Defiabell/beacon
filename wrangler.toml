name = "beacon"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[triggers]
# Separate invocation budgets: GitHub at 01:00 UTC, posts at 01:10,
# analytics at 01:20, then the two audit shards. A minute list keeps the
# account-level Cron Trigger count at one. Routing: src/schedule.ts.
crons = ["0,10,20,30,40 1 * * *"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "beacon"
database_id = "b1b64387-3398-4df8-b2a1-0a5138997f2b"
