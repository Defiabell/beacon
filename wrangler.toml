name = "beacon"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[triggers]
# Split in two: "0 1 * * *" runs github/posts/goatcounter (cheap), "30 1 * * *"
# runs audit alone (the expensive one — per-repo README fetch + broken-link
# checks). Keeps each invocation comfortably under the free tier's
# 50-subrequests-per-invocation cap; see src/index.ts's scheduled handler for
# the event.cron -> sources routing and src/audit/run.ts's MAX_LINKS_CHECKED
# for the budget math.
crons = ["0 1 * * *", "30 1 * * *"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "beacon"
database_id = "placeholder-replace-after-d1-create"
